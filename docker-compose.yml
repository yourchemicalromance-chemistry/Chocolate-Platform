services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chocolate-backend
    restart: unless-stopped
    init: true
    user: "1000:1000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required for the backend}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      CHOCOLATE_REVIEWER_USER_ID: ${CHOCOLATE_REVIEWER_USER_ID:-}
      MEDIA_STORAGE_ROOT: /srv/chocolate-media
      MEDIA_DELETION_WORKER_ENABLED: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - type: bind
        source: /srv/chocolate-media
        target: /srv/chocolate-media
        read_only: false
        bind:
          create_host_path: false
    networks:
      - chocolate_api
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7.4-alpine
    container_name: chocolate-redis
    restart: unless-stopped
    env_file:
      - .env
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - chocolate_backend
      - chocolate_api

volumes:
  # Retained for existing local MySQL data; no service mounts these volumes.
  mysql_data:
  mysql_data_recovery:
    name: chocolate_mysql_data_recovery
  redis_data:

networks:
  chocolate_backend:
    driver: bridge
  chocolate_api:
    driver: bridge
